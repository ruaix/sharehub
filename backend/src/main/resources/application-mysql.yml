spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sharehub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true}
    username: ${DB_USERNAME:sharehub}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/mysql
